name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Images are pinned by digest. The comment says what the digest was when it was pinned.
  SONARQUBE_IMAGE: sonarqube@sha256:f95aaa9016dd4e92c7d70691167a6d96dbb5d8acffd61eba1cb4335d364a7840 # community 26.10.0.133078
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238 # stable, 2026-11-01
  LAX_IMAGE: python@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8 # 3.13-alpine, 2026-11-01

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, coverage floor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: service/pom.xml
      - name: Compile, test, report coverage, enforce the coverage floor
        run: mvn --batch-mode --no-transfer-progress --file service/pom.xml verify
      - name: Keep the jar and the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-build
          path: |
            service/target/pipeline-service.jar
            service/target/site/jacoco/jacoco.xml
            service/target/surefire-reports/*.xml
          if-no-files-found: error

  image:
    name: Image builds, starts, answers
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: service-build
          path: service-build
      - name: Build the image from the jar the build job made
        run: |
          set -euo pipefail
          mkdir -p service/target
          cp service-build/pipeline-service.jar service/target/pipeline-service.jar
          docker build -t pipeline-service:ci service
          docker image inspect pipeline-service:ci --format 'size={{.Size}} user={{.Config.User}}'
      - name: Start it and ask it three things
        run: |
          set -euo pipefail
          docker run -d --name svc -p 8080:8080 pipeline-service:ci
          timeout 30 sh -c 'until curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; do sleep 1; done'
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS "http://127.0.0.1:8080/hello?name=Ada" | grep -qx "hello, Ada"
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/hello?name=%3Cscript%3E")
          test "$code" = "400"
          curl -fsSI http://127.0.0.1:8080/healthz | tee headers.txt
          grep -qi '^x-content-type-options: nosniff' headers.txt
          user=$(docker exec svc id -u)
          test "$user" = "10001"
      - name: The base image is pinned by digest
        run: |
          set -uo pipefail
          from=$(grep -E '^FROM ' service/Dockerfile | head -1)
          if ! grep -Eq '@sha256:[0-9a-f]{64}' <<<"${from}"; then
            docker pull --quiet eclipse-temurin:21-jre-alpine > /dev/null
            digest=$(docker image inspect eclipse-temurin:21-jre-alpine --format '{{index .RepoDigests 0}}' || true)
            echo "::error title=base image is not pinned::${from} has no digest; today the tag is ${digest}"
            exit 1
          fi
          echo "${from}"
      - name: Fetch Trivy, checked against tools.lock
        run: scripts/fetch-tool.sh trivy
      - name: The image has no fixable HIGH or CRITICAL vulnerability
        run: |
          set -o pipefail
          tools/bin/trivy image --no-progress --skip-version-check \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 pipeline-service:ci 2>&1 | tee trivy-service.txt
          LEVEL=notice scripts/annotate-tail.sh "Trivy on the service image" trivy-service.txt 12
      - name: An old image fails the same scan, and the scan names what is wrong
        run: |
          set -uo pipefail
          docker pull --quiet alpine:3.12
          status=0
          tools/bin/trivy image --no-progress --skip-version-check \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 alpine:3.12 > trivy-demo.txt 2>&1 || status=$?
          tail -n 40 trivy-demo.txt
          echo "trivy exit status: ${status}"
          test "${status}" -eq 1
          grep -Eq "Total: [1-9]" trivy-demo.txt
          grep -E "^Total:" trivy-demo.txt | head -5 > trivy-demo-totals.txt
          LEVEL=notice scripts/annotate-tail.sh "Trivy on alpine:3.12" trivy-demo-totals.txt 5
      - if: always()
        run: docker logs svc || true

  gitlab-schema:
    name: The GitLab version is valid against GitLab's schema
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate .gitlab-ci.yml, and prove the validator rejects a broken file
        run: |
          set -uo pipefail
          pip install --quiet check-jsonschema==0.39.0
          check-jsonschema --builtin-schema vendor.gitlab-ci .gitlab-ci.yml
          printf 'stages: [a]\nbuild:\n  stage: a\n  scripts: [echo]\n' > broken.yml
          status=0
          check-jsonschema --builtin-schema vendor.gitlab-ci broken.yml || status=$?
          test "${status}" -ne 0

  osv:
    name: Known-vulnerable dependencies (OSV-Scanner)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tools.lock agrees with the publishers' own checksum files
        run: scripts/verify-lock.sh
      - name: Fetch OSV-Scanner, checked against tools.lock
        run: scripts/fetch-tool.sh osv-scanner
      - name: The service has no known-vulnerable dependency
        run: tools/bin/osv-scanner scan source --lockfile service/pom.xml
      - name: A vulnerable dependency fails the scan, and the scan says which one
        run: |
          set -uo pipefail
          status=0
          tools/bin/osv-scanner scan source --lockfile pom.xml:demo/vulnerable-dependency/vulnerable.pom > osv-demo.txt 2>&1 || status=$?
          cat osv-demo.txt
          echo "osv-scanner exit status: ${status}"
          test "${status}" -eq 1
          grep -Eq "GHSA-jfh8-c2jp-5v3q|CVE-2021-44228" osv-demo.txt
          echo "::notice title=OSV-Scanner on the vulnerable pom::$(grep -Eo 'GHSA-[0-9a-z-]+|CVE-[0-9]+-[0-9]+' osv-demo.txt | sort -u | tr '\n' ' ')"

  sonarqube:
    name: Code quality gate (SonarQube)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: service/pom.xml
      - name: Start a throw-away SonarQube
        run: scripts/sonarqube.sh up
      - name: Define the quality gate
        run: scripts/sonarqube.sh gate-define sonar/quality-gate.json
      - name: Analyse the service; the build waits for the quality gate and fails if it fails
        run: |
          set -uo pipefail
          scripts/sonarqube.sh project pipeline-service pipeline-service
          status=0
          mvn --batch-mode --no-transfer-progress --file service/pom.xml verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.host.url=http://127.0.0.1:9000 -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300 2>&1 | tee sonar-service.log || status=${PIPESTATUS[0]}
          if [ "${status}" -ne 0 ]; then
            scripts/annotate-tail.sh "SonarQube analysis of the service failed" sonar-service.log 30
          fi
          exit "${status}"
      - name: The gate of the service, condition by condition
        run: scripts/sonarqube.sh gate pipeline-service
      - name: Code that is wrong on purpose fails the same gate
        run: |
          set -uo pipefail
          scripts/sonarqube.sh project demo-bad-code demo-bad-code
          status=0
          mvn --batch-mode --no-transfer-progress --file demo/bad-code/pom.xml compile \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.host.url=http://127.0.0.1:9000 -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300 2>&1 | tee sonar-bad.log || status=${PIPESTATUS[0]}
          gate=0
          scripts/sonarqube.sh gate demo-bad-code > sonar-bad-gate.log 2>&1 || gate=$?
          cat sonar-bad-gate.log
          if [ "${status}" -eq 0 ] || [ "${gate}" -ne 1 ]; then
            { echo "maven status ${status}, gate status ${gate}"; cat sonar-bad-gate.log; tail -n 25 sonar-bad.log; } > sonar-bad-summary.log
            scripts/annotate-tail.sh "The bad code did not fail the gate as required" sonar-bad-summary.log 60
            exit 1
          fi
      - if: always()
        run: docker logs sonarqube 2>&1 | tail -n 30 || true

  zap:
    name: Running service, passive scan (OWASP ZAP baseline)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: service-build
          path: service-build
      - name: Build the image and start it on a private network
        run: |
          set -euo pipefail
          mkdir -p service/target
          cp service-build/pipeline-service.jar service/target/pipeline-service.jar
          docker build -t pipeline-service:ci service
          docker network create scan
          docker run -d --name svc --network scan pipeline-service:ci
          timeout 30 sh -c 'until docker exec svc wget -q -O /dev/null http://127.0.0.1:8080/healthz; do sleep 1; done'
      - name: ZAP baseline against the running service; any warning fails the job
        run: |
          set -uo pipefail
          docker pull --quiet "${ZAP_IMAGE}"
          echo "::notice title=ZAP image::$(docker inspect --format '{{index .RepoDigests 0}}' "${ZAP_IMAGE}")"
          status=0
          scripts/zap-baseline.sh "http://svc:8080/hello?name=zap" service || status=$?
          if [ "${status}" -ne 0 ]; then
            scripts/annotate-tail.sh "ZAP found something in the service (exit status ${status})" zap-out/service-findings.log 40
          fi
          LEVEL=notice scripts/annotate-tail.sh "ZAP on the service" zap-out/service-findings.log 10
          exit "${status}"
      - name: The same scan on a server with no defensive headers reports them
        run: |
          set -uo pipefail
          docker pull --quiet "${LAX_IMAGE}"
          echo "::notice title=lax image::$(docker inspect --format '{{index .RepoDigests 0}}' "${LAX_IMAGE}")"
          docker run -d --name lax --network scan "${LAX_IMAGE}" python -m http.server 8000 --directory /tmp
          timeout 30 sh -c 'until docker exec lax wget -q -O /dev/null http://127.0.0.1:8000/; do sleep 1; done'
          status=0
          scripts/zap-baseline.sh "http://lax:8000/" lax || status=$?
          test "${status}" -eq 2
          grep -Eq "10020|10021|10038" zap-out/lax-findings.log
          LEVEL=notice scripts/annotate-tail.sh "ZAP on a server with no defensive headers" zap-out/lax-findings.log 14
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report
          path: zap-out/
          if-no-files-found: ignore
