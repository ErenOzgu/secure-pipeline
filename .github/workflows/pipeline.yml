name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SONARQUBE_IMAGE: sonarqube:community
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, coverage floor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: service/pom.xml
      - name: Compile, test, report coverage, enforce the coverage floor
        run: mvn --batch-mode --no-transfer-progress --file service/pom.xml verify
      - name: Keep the jar and the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-build
          path: |
            service/target/pipeline-service.jar
            service/target/site/jacoco/jacoco.xml
            service/target/surefire-reports/*.xml
          if-no-files-found: error

  image:
    name: Image builds, starts, answers
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: service-build
          path: service-build
      - name: Build the image from the jar the build job made
        run: |
          set -euo pipefail
          mkdir -p service/target
          cp service-build/pipeline-service.jar service/target/pipeline-service.jar
          docker build -t pipeline-service:ci service
          docker image inspect pipeline-service:ci --format 'size={{.Size}} user={{.Config.User}}'
      - name: Start it and ask it three things
        run: |
          set -euo pipefail
          docker run -d --name svc -p 8080:8080 pipeline-service:ci
          timeout 30 sh -c 'until curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; do sleep 1; done'
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS "http://127.0.0.1:8080/hello?name=Ada" | grep -qx "hello, Ada"
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/hello?name=%3Cscript%3E")
          test "$code" = "400"
          curl -fsSI http://127.0.0.1:8080/healthz | tee headers.txt
          grep -qi '^x-content-type-options: nosniff' headers.txt
          user=$(docker exec svc id -u)
          test "$user" = "10001"
      - name: Where the base image stands today (to be pinned by digest)
        run: |
          docker buildx imagetools inspect eclipse-temurin:21-jre-alpine --format '{{.Manifest.Digest}}' | tee digest.txt
          echo "::notice title=base image digest::eclipse-temurin:21-jre-alpine@$(cat digest.txt)"
      - name: Fetch Trivy, checked against tools.lock
        run: scripts/fetch-tool.sh trivy
      - name: The image has no fixable HIGH or CRITICAL vulnerability
        run: |
          tools/bin/trivy image --no-progress --skip-version-check \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 pipeline-service:ci
      - name: An old image fails the same scan, and the scan names what is wrong
        run: |
          set -uo pipefail
          docker pull --quiet alpine:3.12
          status=0
          tools/bin/trivy image --no-progress --skip-version-check \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 alpine:3.12 > trivy-demo.txt 2>&1 || status=$?
          tail -n 40 trivy-demo.txt
          echo "trivy exit status: ${status}"
          test "${status}" -eq 1
          grep -Eq "Total: [1-9]" trivy-demo.txt
      - if: always()
        run: docker logs svc || true

  osv:
    name: Known-vulnerable dependencies (OSV-Scanner)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tools.lock agrees with the publishers' own checksum files
        run: scripts/verify-lock.sh
      - name: Fetch OSV-Scanner, checked against tools.lock
        run: scripts/fetch-tool.sh osv-scanner
      - name: The service has no known-vulnerable dependency
        run: tools/bin/osv-scanner scan source --lockfile service/pom.xml
      - name: A vulnerable dependency fails the scan, and the scan says which one
        run: |
          set -uo pipefail
          status=0
          tools/bin/osv-scanner scan source --lockfile demo/vulnerable-dependency/pom.xml > osv-demo.txt 2>&1 || status=$?
          cat osv-demo.txt
          echo "osv-scanner exit status: ${status}"
          test "${status}" -eq 1
          grep -Eq "GHSA-jfh8-c2jp-5v3q|CVE-2021-44228" osv-demo.txt

  sonarqube:
    name: Code quality gate (SonarQube)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: service/pom.xml
      - name: Start a throw-away SonarQube
        run: scripts/sonarqube.sh up
      - name: Analyse the service; the build waits for the quality gate and fails if it fails
        run: |
          set -uo pipefail
          status=0
          mvn --batch-mode --no-transfer-progress --file service/pom.xml verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.host.url=http://127.0.0.1:9000 -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300 2>&1 | tee sonar-service.log || status=${PIPESTATUS[0]}
          if [ "${status}" -ne 0 ]; then
            scripts/annotate-tail.sh "SonarQube analysis of the service failed" sonar-service.log 30
          fi
          exit "${status}"
      - name: The gate of the service, condition by condition
        run: scripts/sonarqube.sh gate pipeline-service
      - name: Code that is wrong on purpose fails the same gate
        run: |
          set -uo pipefail
          status=0
          mvn --batch-mode --no-transfer-progress --file demo/bad-code/pom.xml compile \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.host.url=http://127.0.0.1:9000 -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300 || status=$?
          echo "maven exit status: ${status}"
          test "${status}" -ne 0
          gate=0
          scripts/sonarqube.sh gate demo-bad-code || gate=$?
          test "${gate}" -eq 1
      - if: always()
        run: docker logs sonarqube 2>&1 | tail -n 30 || true

  zap:
    name: Running service, passive scan (OWASP ZAP baseline)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: service-build
          path: service-build
      - name: Build the image and start it on a private network
        run: |
          set -euo pipefail
          mkdir -p service/target
          cp service-build/pipeline-service.jar service/target/pipeline-service.jar
          docker build -t pipeline-service:ci service
          docker network create scan
          docker run -d --name svc --network scan pipeline-service:ci
          timeout 30 sh -c 'until docker exec svc wget -q -O /dev/null http://127.0.0.1:8080/healthz; do sleep 1; done'
      - name: ZAP baseline against the running service
        run: |
          set -uo pipefail
          mkdir -m 777 zap
          docker pull --quiet "${ZAP_IMAGE}"
          echo "zap image: $(docker inspect --format '{{index .RepoDigests 0}}' "${ZAP_IMAGE}")"
          status=0
          docker run --rm --network scan --volume "${PWD}/zap:/zap/wrk:rw" "${ZAP_IMAGE}" \
            zap-baseline.py -t "http://svc:8080/hello?name=zap" -J zap.json -r zap.html -m 1 2>&1 | tee zap.log || status=${PIPESTATUS[0]}
          echo "zap exit status: ${status}"
          if [ "${status}" -ne 0 ]; then
            scripts/annotate-tail.sh "ZAP baseline exit status ${status}" zap.log 30
          fi
          test "${status}" -eq 0
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report
          path: zap/
          if-no-files-found: ignore
